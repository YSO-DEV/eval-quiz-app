services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 3007
      DATABASE_URL: postgres://${POSTGRES_USER:-quizuser}:${POSTGRES_PASSWORD:-quizpassword}@db:5432/${POSTGRES_DB:-quizdb}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      FROM_EMAIL: ${FROM_EMAIL:-Quiz App <noreply@example.com>}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3007"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3007/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  db:
    build:
      context: ./database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quizuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizpassword}
      POSTGRES_DB: ${POSTGRES_DB:-quizdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${NGINX_PORT:-8087}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network: